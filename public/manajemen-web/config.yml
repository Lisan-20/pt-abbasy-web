backend:
  name: github
  repo: Lisan-20/pt-abbasy-web
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"
logo_url: "/uploads/logo_transparent.png"


collections:
  - name: "content"
    label: "Site Content"
    editor:
      preview: false
    files:
      - label: "Landing Page Data"
        name: "landing"
        file: "src/content/data.json"
        format: "json"
        extension: "json"
        fields:
          - label: "Struktur Organisasi (Office)"
            name: "organization"
            widget: "list"
            collapsed: true
            summary: "{{name}} - {{role}}"
            fields:
              - {label: "ID Unik (misal: 1, 2, 3 - jangan pakai spasi)", name: "id", widget: "string"}
              - {label: "Nama", name: "name", widget: "string"}
              - {label: "Jabatan", name: "role", widget: "string"}
              - {label: "Foto Profil", name: "photo", widget: "image", required: false}
              - {label: "Melapor Ke (ID Unik)", name: "parentId", widget: "string", required: false}
          - label: "Site Settings (Pengaturan Umum)"
            name: "siteSettings"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Logo Image (Gambar Logo)", name: "logoImage", widget: "image", required: false}
              - {label: "Logo Text (Teks Sebelah Logo)", name: "logoText", widget: "string", required: false}
              - {label: "Logo Text Size", name: "logoTextSize", widget: "string", default: "24px"}
              - {label: "Perataan Teks Paragraf", name: "textAlignment", widget: "select", options: [{label: "Rata Kiri", value: "left"}, {label: "Rata Tengah", value: "center"}, {label: "Rata Kanan", value: "right"}, {label: "Rata Kanan-Kiri", value: "justify"}], default: "justify"}
              - {label: "Favicon Image", name: "favicon", widget: "image", required: false}
              - {label: "Footer Title", name: "footerTitle", widget: "string", required: false}
              - {label: "Footer Description", name: "footerDescription", widget: "text", required: false}
              - {label: "Welcome Description", name: "welcomeDescription", widget: "text", required: false}
              - {label: "SEO Title", name: "seoTitle", widget: "string", required: false}
              - {label: "SEO Description", name: "seoDescription", widget: "text", required: false}
              - {label: "SEO Keywords", name: "seoKeywords", widget: "string", required: false}
              - label: "Theme Customizer"
                name: "theme"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - {label: "Warna Utama", name: "colorPrimary", widget: "color", default: "#0A192F"}
                  - {label: "Warna Aksen", name: "colorAccent", widget: "color", default: "#FF7A00"}
                  - {label: "Tampilkan Hero", name: "showHero", widget: "boolean", default: true}
                  - {label: "Tampilkan Teks Sambutan", name: "showWelcome", widget: "boolean", default: true}
                  - {label: "Tampilkan Layanan", name: "showServices", widget: "boolean", default: true}
                  - {label: "Tampilkan Klien", name: "showClients", widget: "boolean", default: true}
              - label: "Tautan Cepat Footer"
                name: "footerQuickLinks"
                widget: "list"
                collapsed: true
                summary: "{{label}}"
                required: false
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL Path", name: "path", widget: "string"}
              - label: "Navigation Menu"
                name: "navigation"
                widget: "list"
                collapsed: true
                summary: "{{label}}"
                required: false
                fields:
                  - {label: "Label Menu", name: "label", widget: "string"}
                  - {label: "URL/Tautan (Kosongkan jika dropdown)", name: "path", widget: "string", required: false}
                  - {label: "Jadikan Tombol Utama", name: "isButton", widget: "boolean", default: false}
                  - label: "Sub-Menu (Dropdown)"
                    name: "children"
                    widget: "list"
                    collapsed: true
                    required: false
                    fields:
                      - {label: "Label Sub-Menu", name: "label", widget: "string"}
                      - {label: "URL/Tautan", name: "path", widget: "string"}
          - label: "Services"
            name: "services"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            fields:
              - {label: "Service Name", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Projects"
            name: "projects"
            widget: "list"
            collapsed: true
            summary: "{{title}} - {{status}}"
            fields:
              - {label: "Project Name", name: "title", widget: "string"}
              - {label: "Kategori (Infrastruktur, Residensial, dll)", name: "category", widget: "string", required: false}
              - {label: "Client", name: "client", widget: "string"}
              - {label: "Status", name: "status", widget: "string"}
              - {label: "Purpose", name: "purpose", widget: "string"}
              - {label: "Latitude (Peta)", name: "lat", widget: "number", value_type: "float", required: false}
              - {label: "Longitude (Peta)", name: "lng", widget: "number", value_type: "float", required: false}
              - label: "Project Images"
                name: "images"
                widget: "list"
                collapsed: true
                fields:
                  - {label: "Image", name: "image", widget: "image", required: false}
          - label: "Clients"
            name: "clients"
            widget: "list"
            collapsed: true
            summary: "{{name}}"
            fields:
              - {label: "Client Name", name: "name", widget: "string"}
              - {label: "Client Logo", name: "logo", widget: "image", required: false}
          - label: "Experts"
            name: "experts"
            widget: "list"
            collapsed: true
            summary: "{{name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Qualification", name: "qualification", widget: "string"}
              - label: "Certificate Images"
                name: "images"
                widget: "list"
                collapsed: true
                fields:
                  - {label: "Image", name: "image", widget: "image", required: false}
          - label: "Legalitas Perusahaan"
            name: "legal"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Company Name", name: "companyName", widget: "string"}
              - {label: "Akta Pendirian", name: "deed", widget: "string"}
              - {label: "NIB", name: "nib", widget: "string"}
              - {label: "NPWP", name: "npwp", widget: "string"}
              - {label: "SK Kemenkumham", name: "sk", widget: "string"}
              - label: "Legal Scans"
                name: "legalImages"
                widget: "list"
                collapsed: true
                fields:
                  - {label: "Image", name: "image", widget: "image", required: false}
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Address", name: "address", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Phone", name: "phone", widget: "string"}
              - {label: "WhatsApp", name: "whatsapp", widget: "string"}
              - {label: "Facebook URL", name: "facebook", widget: "string", required: false}
              - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
              - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
          - label: "Pages (Perakit Halaman)"
            name: "pages"
            widget: "list"
            collapsed: true
            summary: "{{title}} (/{{slug}})"
            required: false
            fields:
              - {label: "Judul Halaman", name: "title", widget: "string"}
              - {label: "URL Halaman (Slug)", name: "slug", widget: "string"}
              - {label: "Tampilkan di Menu Atas?", name: "showInMenu", widget: "boolean", default: false}
              - label: "Perakitan Blok Halaman"
                name: "blocks"
                widget: "list"
                collapsed: true
                required: false
                types:
                  - label: "Blok: Hero (Banner Atas)"
                    name: "heroBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Headline", name: "headline", widget: "string"}
                      - {label: "Subheadline", name: "subheadline", widget: "string"}
                      - {label: "Background Image", name: "bgImage", widget: "image", required: false}
                      - {label: "Background Video (.mp4)", name: "videoFile", widget: "file", required: false}
                  - label: "Blok: Peta Proyek"
                    name: "mapBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                      - {label: "Fokus Peta (Indonesia/Dunia)", name: "focus", widget: "select", options: ["Indonesia", "Dunia"], default: "Indonesia"}
                  - label: "Blok: Tentang/Info"
                    name: "aboutBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul", name: "title", widget: "string"}
                      - {label: "Deskripsi", name: "description", widget: "text"}
                      - label: "Kartu Teks"
                        name: "items"
                        widget: "list"
                        collapsed: true
                        required: false
                        fields:
                          - {label: "Judul", name: "title", widget: "string"}
                          - {label: "Isi", name: "content", widget: "text"}
                  - label: "Blok: Markdown"
                    name: "markdownBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Isi Konten", name: "content", widget: "markdown"}
                  - label: "Blok: Layanan"
                    name: "servicesBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                      - {label: "Batas Jumlah", name: "limit", widget: "number", default: 0}
                  - label: "Blok: Galeri"
                    name: "galleryBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul", name: "title", widget: "string", required: false}
                      - label: "Daftar Foto"
                        name: "photos"
                        widget: "list"
                        collapsed: true
                        fields:
                          - {label: "Foto", name: "image", widget: "image"}
                          - {label: "Keterangan", name: "caption", widget: "string", required: false}
                  - label: "Blok: Portofolio"
                    name: "portfolioBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Organisasi"
                    name: "organizationBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Tenaga Ahli"
                    name: "expertsBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Legalitas"
                    name: "legalBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Kontak"
                    name: "contactBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Logo Klien"
                    name: "clientsMarqueeBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Aktifkan", name: "active", widget: "boolean", default: true}
                  - label: "Blok: Statistik"
                    name: "statsBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul", name: "title", widget: "string", required: false}
                      - {label: "Sub-judul", name: "subtitle", widget: "string", required: false}
                      - label: "Statistik"
                        name: "stats"
                        widget: "list"
                        collapsed: true
                        fields:
                          - {label: "Angka", name: "value", widget: "number"}
                          - {label: "Suffix", name: "suffix", widget: "string", required: false}
                          - {label: "Label", name: "label", widget: "string"}
                          - {label: "Ikon", name: "icon", widget: "string", required: false}
                  - label: "Blok: Testimoni"
                    name: "testimonialsBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul", name: "title", widget: "string", default: "Apa Kata Klien Kami"}
                      - label: "Testimoni"
                        name: "testimonials"
                        widget: "list"
                        collapsed: true
                        fields:
                          - {label: "Kutipan", name: "quote", widget: "text"}
                          - {label: "Nama", name: "name", widget: "string"}
                          - {label: "Jabatan", name: "position", widget: "string", required: false}
                          - {label: "Perusahaan", name: "company", widget: "string", required: false}
                          - {label: "Rating", name: "rating", widget: "number", default: 5, value_type: "int", min: 1, max: 5}
                          - {label: "Foto", name: "photo", widget: "image", required: false}

  - name: "articles"
    label: "Newsroom (Berita & PR)"
    folder: "src/content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Judul", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string", required: false}
      - {label: "Kategori Berita", name: "category", widget: "select", options: ["Blog", "Press Release", "Pengumuman"], default: "Blog"}
      - {label: "Tanggal Terbit", name: "date", widget: "datetime"}
      - {label: "Penulis", name: "author", widget: "string", default: "Admin"}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false}
      - {label: "Ringkasan", name: "summary", widget: "text"}
      - {label: "Isi Konten", name: "content", widget: "markdown"}

  - name: "careers"
    label: "Lowongan Kerja (Karir)"
    folder: "src/content/careers"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Judul Posisi", name: "title", widget: "string"}
      - {label: "Departemen", name: "department", widget: "string"}
      - {label: "Lokasi", name: "location", widget: "string"}
      - {label: "Tipe Pekerjaan", name: "type", widget: "select", options: ["Full-time", "Part-time", "Contract", "Internship"], default: "Full-time"}
      - {label: "Aktif Dibuka?", name: "active", widget: "boolean", default: true}
      - {label: "Deskripsi", name: "description", widget: "markdown"}
      - {label: "Persyaratan", name: "requirements", widget: "markdown"}
