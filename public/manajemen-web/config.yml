backend:
  name: github
  repo: Lisan-20/pt-abbasy-web
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"
logo_url: "/uploads/logo_transparent.png"

collections:
  - name: "content"
    label: "Site Content"
    editor:
      preview: false
    files:
      - label: "Landing Page Data"
        name: "landing"
        file: "src/content/data.json"
        format: "json"
        extension: "json"
        fields:
          - label: "Struktur Organisasi (Office)"
            name: "organization"
            widget: "list"
            collapsed: true
            summary: "{{name}} - {{role}}"
            fields:
              - label: "ID Unik (misal: 1, 2, 3 - jangan pakai spasi)"
                name: "id"
                widget: "string"
              - label: "Nama"
                name: "name"
                widget: "string"
              - label: "Jabatan"
                name: "role"
                widget: "string"
              - label: "Foto Profil"
                name: "photo"
                widget: "image"
                required: false
              - label: "Melapor Ke (Isi ID Unik atasan. Jika lebih dari 1, pisahkan dengan koma misal: 1, 2)"
                name: "parentId"
                widget: "string"
                required: false
          - label: "Site Settings (Pengaturan Umum)"
            name: "siteSettings"
            widget: "object"
            collapsed: true
            fields:
              - label: "Logo Image (Gambar Logo)"
                name: "logoImage"
                widget: "image"
                required: false
              - label: "Logo Text (Teks Sebelah Logo)"
                name: "logoText"
                widget: "string"
                required: false
              - label: "Logo Text Size (Ukuran, misal: 24px)"
                name: "logoTextSize"
                widget: "string"
                default: "24px"
              - label: "Perataan Teks Paragraf (Kiri, Tengah, Kanan-Kiri)"
                name: "textAlignment"
                widget: "select"
                options:
                  - label: "Rata Kiri (Left)"
                    value: "left"
                  - label: "Rata Tengah (Center)"
                    value: "center"
                  - label: "Rata Kanan (Right)"
                    value: "right"
                  - label: "Rata Kanan-Kiri (Justify)"
                    value: "justify"
                default: "justify"
              - label: "Favicon Image (Ikon Tab Browser)"
                name: "favicon"
                widget: "image"
                required: false
              - label: "Footer Title (Judul di bagian bawah)"
                name: "footerTitle"
                widget: "string"
                required: false
              - label: "Footer Description (Deskripsi di bagian bawah)"
                name: "footerDescription"
                widget: "text"
                required: false
              - label: "Welcome Description (Teks Sambutan Beranda)"
                name: "welcomeDescription"
                widget: "text"
                required: false
              - label: "SEO Title (Judul Website di Google)"
                name: "seoTitle"
                widget: "string"
                required: false
              - label: "SEO Description (Deskripsi Website di Google)"
                name: "seoDescription"
                widget: "text"
                required: false
              - label: "SEO Keywords (Kata Kunci Pencarian)"
                name: "seoKeywords"
                widget: "string"
                required: false
              - label: "Theme Customizer (Pengaturan Tampilan)"
                name: "theme"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - label: "Warna Utama (Teks Heading & Navbar)"
                    name: "colorPrimary"
                    widget: "color"
                    default: "#0A192F"
                  - label: "Warna Aksen (Tombol & Garis Bawah)"
                    name: "colorAccent"
                    widget: "color"
                    default: "#FF7A00"
                  - label: "Tampilkan Banner Utama (Hero)?"
                    name: "showHero"
                    widget: "boolean"
                    default: true
                  - label: "Tampilkan Teks Sambutan (Welcome)?"
                    name: "showWelcome"
                    widget: "boolean"
                    default: true
                  - label: "Tampilkan Daftar Layanan di Beranda?"
                    name: "showServices"
                    widget: "boolean"
                    default: true
                  - label: "Tampilkan Logo Klien (Berjalan)?"
                    name: "showClients"
                    widget: "boolean"
                    default: true
              - label: "Navigation Menu (Menu Atas)"
                name: "navigation"
                widget: "list"
                collapsed: true
                summary: "{{label}}"
                required: false
                fields:
                  - label: "Label Menu (Teks yang Tampil)"
                    name: "label"
                    widget: "string"
                  - label: "URL/Tautan (Gunakan / di depan, misal: /about)"
                    name: "path"
                    widget: "string"
                  - label: "Jadikan Tombol Utama (Warna Jingga)?"
                    name: "isButton"
                    widget: "boolean"
                    default: false
          - label: "Services"
            name: "services"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            fields:
              - label: "Service Name"
                name: "title"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
          - label: "Projects"
            name: "projects"
            widget: "list"
            collapsed: true
            summary: "{{title}} - {{status}}"
            fields:
              - label: "Project Name"
                name: "title"
                widget: "string"
              - label: "Client"
                name: "client"
                widget: "string"
              - label: "Status"
                name: "status"
                widget: "string"
              - label: "Purpose"
                name: "purpose"
                widget: "string"
              - label: "Project Images (Foto-foto Proyek)"
                name: "images"
                widget: "list"
                collapsed: true
                summary: "Foto Proyek"
                fields:
                  - label: "Image"
                    name: "image"
                    widget: "image"
                    required: false
          - label: "Clients"
            name: "clients"
            widget: "list"
            collapsed: true
            summary: "{{name}}"
            fields:
              - label: "Client Name"
                name: "name"
                widget: "string"
              - label: "Client Logo (Opsional)"
                name: "logo"
                widget: "image"
                required: false
          - label: "Experts (Tenaga Ahli)"
            name: "experts"
            widget: "list"
            collapsed: true
            summary: "{{name}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Qualification"
                name: "qualification"
                widget: "string"
              - label: "Certificate Images"
                name: "images"
                widget: "list"
                collapsed: true
                summary: "Foto Sertifikat"
                fields:
                  - label: "Image"
                    name: "image"
                    widget: "image"
                    required: false
          - label: "Legalitas Perusahaan"
            name: "legal"
            widget: "object"
            collapsed: true
            fields:
              - label: "Company Name"
                name: "companyName"
                widget: "string"
              - label: "Akta Pendirian"
                name: "deed"
                widget: "string"
              - label: "NIB"
                name: "nib"
                widget: "string"
              - label: "NPWP"
                name: "npwp"
                widget: "string"
              - label: "SK Kemenkumham"
                name: "sk"
                widget: "string"
              - label: "Legal Scans"
                name: "legalImages"
                widget: "list"
                collapsed: true
                summary: "Scan Dokumen Legal"
                fields:
                  - label: "Image"
                    name: "image"
                    widget: "image"
                    required: false
          - label: "Contact Info"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - label: "Address"
                name: "address"
                widget: "string"
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "Phone"
                name: "phone"
                widget: "string"
              - label: "WhatsApp"
                name: "whatsapp"
                widget: "string"
              - label: "Facebook URL"
                name: "facebook"
                widget: "string"
                required: false
              - label: "Instagram URL"
                name: "instagram"
                widget: "string"
                required: false
              - label: "LinkedIn URL"
                name: "linkedin"
                widget: "string"
                required: false
          - label: "Pages (Perakit Halaman)"
            name: "pages"
            widget: "list"
            collapsed: true
            summary: "{{title}} (/{{slug}})"
            required: false
            fields:
              - label: "Judul Halaman (Muncul di Menu)"
                name: "title"
                widget: "string"
              - label: "URL Halaman (Slug, misal: promo - dilarang pakai spasi, gunakan / untuk Beranda)"
                name: "slug"
                widget: "string"
              - label: "Tampilkan di Menu Atas?"
                name: "showInMenu"
                widget: "boolean"
                default: false
              - label: "Perakitan Blok Halaman"
                name: "blocks"
                widget: "list"
                collapsed: true
                required: false
                types:
                  - label: "Blok: Hero (Banner Atas)"
                    name: "heroBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Headline", name: "headline", widget: "string"}
                      - {label: "Subheadline", name: "subheadline", widget: "string"}
                      - {label: "Background Image", name: "bgImage", widget: "image", required: false}
                  - label: "Blok: Tentang/Info (Dengan Kartu Teks)"
                    name: "aboutBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                      - {label: "Deskripsi Panjang", name: "description", widget: "text"}
                      - label: "Daftar Kartu Teks (Visi, Misi, Sejarah, dll)"
                        name: "items"
                        widget: "list"
                        collapsed: true
                        required: false
                        fields:
                          - {label: "Judul Kartu", name: "title", widget: "string"}
                          - {label: "Isi Teks", name: "content", widget: "text"}
                  - label: "Blok: Teks Bebas (Markdown)"
                    name: "markdownBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Isi Konten", name: "content", widget: "markdown"}
                  - label: "Blok: Daftar Layanan/Fitur"
                    name: "servicesBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                      - {label: "Batas Jumlah (0 = Tampilkan Semua)", name: "limit", widget: "number", default: 0}
                  - label: "Blok: Galeri Foto (Album)"
                    name: "galleryBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Galeri (Opsional)", name: "title", widget: "string", required: false}
                      - label: "Daftar Foto"
                        name: "photos"
                        widget: "list"
                        collapsed: true
                        fields:
                          - {label: "Pilih Foto", name: "image", widget: "image"}
                          - {label: "Keterangan Foto (Opsional)", name: "caption", widget: "string", required: false}
                  - label: "Blok: Portofolio (Proyek Kami)"
                    name: "portfolioBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Struktur Organisasi"
                    name: "organizationBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Tenaga Ahli (Sertifikasi)"
                    name: "expertsBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Legalitas Perusahaan"
                    name: "legalBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Hubungi Kami (Kontak)"
                    name: "contactBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Judul Blok", name: "title", widget: "string"}
                  - label: "Blok: Logo Klien (Marquee Berjalan)"
                    name: "clientsMarqueeBlock"
                    widget: "object"
                    collapsed: true
                    fields:
                      - {label: "Aktifkan Logo Klien", name: "active", widget: "boolean", default: true}
